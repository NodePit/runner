# NodePit Runner — nginx extension
#
# Adds an HTTPS reverse proxy (nginx-proxy) in front of the web/api services,
# with automatic Let's Encrypt certificates via acme-companion.
#
# Requires DOMAIN and LETSENCRYPT_EMAIL to be set in .env (see
# .env.example), and a DNS entry pointing DOMAIN at this server. Also set
# WEB_BASE_URL=https://<DOMAIN> in .env so links generated by Runner use the
# public HTTPS URL.
#
# Usage:
#   docker compose -f docker-compose.yml -f extensions/nginx/docker-compose.yml up -d

services:
  web:
    environment:
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env before using the nginx extension — see .env.example}
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in .env before using the nginx extension — see .env.example}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env before using the nginx extension — see .env.example}
    # with HTTPS in front, plain HTTP on port 8080 stays reachable from this
    # host only (e.g. for an SSH tunnel), instead of bypassing the proxy
    ports: !override
      - 127.0.0.1:8080:80

  # nginx-proxy runs as two containers, so that the publicly exposed nginx has
  # no access to the Docker socket:
  # https://github.com/nginx-proxy/nginx-proxy/blob/1.11.6/docs/README.md#separate-containers
  #
  # nginx is pinned on its own, on the mainline branch that nginx-proxy builds
  # on, so that security fixes don't have to wait for an nginx-proxy release;
  # the watchtower extension doesn't update it, it's updated in this repository
  nginx-proxy:
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./extensions/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - ./extensions/nginx/conf.d:/etc/nginx/conf.d
    labels:
      # docker-gen reloads the container with this label, and reads its networks
      - com.github.nginx-proxy.nginx-proxy.nginx
      # acme-companion reloads the container with this label
      - com.github.nginx-proxy.nginx=true

  # renders the nginx configuration from the running containers and reloads
  # nginx; nginx-proxy's own docker-gen image, which contains the template
  nginx-proxy-gen:
    image: nginxproxy/nginx-proxy:1.11.6-dockergen
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      # the template reads its settings from the docker-gen container:
      # nothing is in front of nginx-proxy, so it sets the X-Forwarded-* headers
      # itself instead of passing on what clients send
      TRUST_DOWNSTREAM_PROXY: "false"
      # like the default `Mozilla-Intermediate`, but without DHE (and without
      # ChaCha20 for TLS 1.2), and the server's cipher order decides, also for
      # TLS 1.3 (whose suites stay the same); see `ssl_policy` in the template
      SSL_POLICY: AWS-TLS13-1-2-Res-2021-06
    labels:
      # acme-companion re-renders the configuration through the container with this label
      - com.github.nginx-proxy.docker-gen

  acme-companion:
    image: nginxproxy/acme-companion:2.8.1
    restart: unless-stopped
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  certs:
  vhost:
  html:
  acme:
