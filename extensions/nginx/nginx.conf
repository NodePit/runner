# the stock `/etc/nginx/nginx.conf` of the nginx image, except for two
# settings which the `nginxproxy/nginx-proxy` image used to set:
#
# * `worker_connections` raised from 1024 to 10240:
#   https://github.com/nginx-proxy/nginx-proxy/pull/973
#
# * `worker_rlimit_nofile` set to twice `worker_connections`, because every
#   proxied connection needs two file descriptors (client and upstream):
#   https://github.com/nginx-proxy/nginx-proxy/pull/2387
#
# when updating the nginx image, compare against its stock `nginx.conf`


user  nginx;
worker_processes  auto;
worker_rlimit_nofile 20480;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  10240;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
