# NodePit Runner — Docker Compose file
#
# Four services: api, web, executor and mongodb. Edit the values marked below,
# then run `docker compose up -d` to start the stack.
#
# Docs:
#   Installation   https://docs.nodepit.com/runner/installation
#   Configuration  https://docs.nodepit.com/runner/configuration
#     - public URL, HTTPS/reverse proxy setup
#     - rotating the MongoDB password
#     - executor resource limits, name and tags
#   Full reference https://docs.nodepit.com/runner

x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: '100m'
    max-file: '5'

services:
  api:
    image: ghcr.io/nodepit/runner-api:1
    volumes:
      - api-data:/nodepit
    environment:
      # Must match MONGO_INITDB_ROOT_USERNAME/PASSWORD on the mongodb service below.
      DB_URL: mongodb://root:drnFEtX_PWKizUzKr3KT@mongodb/nodepit-runner?authSource=admin
      # Shared secret with API_KEY on the executor service below.
      API_KEY: nYCA3oaqhYJ__GEteWye
      # The URL Runner is reachable at. Change for anything beyond local use.
      WEB_BASE_URL: http://localhost:8080
    depends_on:
      - mongodb
    logging: *default-logging

  web:
    image: ghcr.io/nodepit/runner-web:1
    ports:
      - 8080:80
    environment:
      API_BASE_URL: http://api:3000
    depends_on:
      - api
    logging: *default-logging

  executor:
    image: ghcr.io/nodepit/runner-executor:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - executor-data:/opt/data
    environment:
      API_BASE_URL: http://api:3000
      # Shared secret with API_KEY on the api service above.
      API_KEY: nYCA3oaqhYJ__GEteWye
    depends_on:
      - api
    deploy:
      # Number of executors to start.
      replicas: 1
    logging: *default-logging

  mongodb:
    image: mongo:7.0.31
    volumes:
      - mongodb-data:/data/db
    environment:
      # Must match the username/password in DB_URL on the api service above.
      # Only used when initializing a new database — see the docs to change it later.
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: drnFEtX_PWKizUzKr3KT
    logging: *default-logging

volumes:
  api-data:
  executor-data:
  mongodb-data:
