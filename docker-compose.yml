# NodePit Runner — Docker Compose file
#
# Four services: api, web, executor and mongodb. Works out of the box with
# `docker compose up -d` — no editing required.
#
# All secrets and settings below have working defaults baked in via
# `${VAR:-default}`. To change one (e.g. the shared API key), place a `.env`
# file next to this one and set the variable there — see `.env.example`.
#
# Want HTTPS or automatic updates? See the `extensions/` directory and the
# README.
#
# Docs:
#   Installation   https://docs.nodepit.com/runner/installation
#   Configuration  https://docs.nodepit.com/runner/configuration
#     - public URL, HTTPS/reverse proxy setup
#     - rotating the MongoDB password
#     - executor resource limits, name and tags
#   Full reference https://docs.nodepit.com/runner

x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: '100m'
    max-file: '5'

services:
  api:
    image: ghcr.io/nodepit/runner-api:1
    restart: unless-stopped
    volumes:
      - api-data:/nodepit
    environment:
      # Built from MONGO_ROOT_USERNAME/MONGO_ROOT_PASSWORD below.
      DB_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-drnFEtX_PWKizUzKr3KT}@mongodb/nodepit-runner?authSource=admin
      # Shared secret with API_KEY on the executor service below.
      API_KEY: ${API_KEY:-nYCA3oaqhYJ__GEteWye}
      # The URL Runner is reachable at. Change for anything beyond local use.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
    depends_on:
      - mongodb
    logging: *default-logging

  web:
    image: ghcr.io/nodepit/runner-web:1
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      API_BASE_URL: http://api:3000
    depends_on:
      - api
    logging: *default-logging

  executor:
    image: ghcr.io/nodepit/runner-executor:1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - executor-data:/opt/data
    environment:
      API_BASE_URL: http://api:3000
      # Shared secret with API_KEY on the api service above.
      API_KEY: ${API_KEY:-nYCA3oaqhYJ__GEteWye}
    depends_on:
      - api
    deploy:
      # Number of executors to start.
      replicas: 1
    logging: *default-logging

  mongodb:
    image: mongo:7.0.37
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      # Only used when initializing a new database — see the docs to change
      # the password later.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-drnFEtX_PWKizUzKr3KT}
    logging: *default-logging

volumes:
  api-data:
  executor-data:
  mongodb-data:
